<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get in Touch</title>
    <link rel="stylesheet" href="styles/travel-form.css">
    <script src="scripts/travel-form.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <img src="images/logo-removebg-preview.png" alt="logo">
            <button class="burger-menu" aria-label="Toggle menu">
                <span class="burger-menu__bar"></span>
                <span class="burger-menu__bar"></span>
                <span class="burger-menu__bar"></span>
            </button>
            <ul>
                <li><a href="travel.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="travel-form.html">Explore</a></li>
                <li><a href="favorites.html">Favorites</a></li>
            </ul>
            
        </nav>
    </header>
    <div class="container">
        <div class="header">
            <div class="explore">Explore</div>
            <h1>Get in Touch</h1>
            <p class="subtitle">Sign up for exclusive travel insights and tips!</p>
        </div>

        <form id="contactForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
            </div>

            <div class="form-group">
                <label for="topic">Select a Topic</label>
                <select id="topic" name="topic" required>
                    <option value="">Choose One...</option>
                    <option value="general">General Inquiry</option>
                    <option value="support">Support</option>
                    <option value="feedback">Feedback</option>
                    <option value="partnership">Partnership</option>
                </select>
            </div>

            <div class="form-group">
                <label>Your Role in Travel</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="traveler" name="role" value="traveler" required>
                        <label for="traveler">Traveler</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="enthusiast" name="role" value="enthusiast">
                        <label for="enthusiast">Travel Enthusiast</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="professional" name="role" value="professional">
                        <label for="professional">Travel Professional</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="blogger" name="role" value="blogger">
                        <label for="blogger">Travel Blogger</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="otherInterest" name="role" value="otherInterest">
                        <label for="otherInterest">Other Interest</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="other" name="role" value="other">
                        <label for="other">Other</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to Terms</label>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

    <div id="successMessage" class="success-message">
        Thank you! Your message has been sent successfully.
    </div>

    <footer>
        <p>&copy; <span id="year"></span> | Yerlin A. Rodriguez | Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
