<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Temples responsive website ">
    <meta name="author" content="Yerlin A. Rodriguez">
    <title>Temple Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="screen and (min-width: 768px)">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h1>Temple Gallery</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
        <button id="hamburger">☰</button>
    </header>

    <main>
        <h2>Home</h2>
        <div class="temple-grid">
            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/santo-domingo-dominican-republic-temple/santo-domingo-dominican-republic-temple-1444-main.jpg" alt="San Diego California Temple">
                <figcaption>Santo Domingo, Dominican Republic Temple</figcaption>
            </figure>
            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/albuquerque-new-mexico-temple/albuquerque-new-mexico-temple-55799.jpg" alt="Albuquerque New Mexico Temple">
                <figcaption>Albuquerque New Mexico Temple</figcaption>
            </figure>
            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/mexico-city-mexico-temple/mexico-city-mexico-temple-4058.jpg" alt="Mexico City Mexico Temple">
                <figcaption>Mexico City Mexico Temple</figcaption>
            </figure>
            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/washington-d.c.-temple/washington-d.c.-temple-29514.jpg" alt="Washington D.C. Temple">
                <figcaption>Washington D.C. Temple</figcaption>
            </figure>
            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/casper-wyoming-temple/casper-wyoming-temple-51916.jpg" alt="Casper Wyoming Temple">
                <figcaption>Casper Wyoming Temple</figcaption>
            </figure>
            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/nauvoo-illinois-temple/nauvoo-illinois-temple-50576.jpg" alt="Nauvoo Illinois Temple">
                <figcaption>Nauvoo Illinois Temple</figcaption>
            </figure>
            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/boise-idaho-temple/boise-idaho-temple-52951.jpg" alt="Boise Idaho Temple
                ">
                <figcaption>Boise Idaho Temple</figcaption>
            </figure>
            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/seoul-korea-temple/seoul-korea-temple-22312.jpg" alt="Seoul Korea Temple">
                <figcaption>Seoul Korea Temple</figcaption>
            </figure>
            <figure>
                <img src="https://churchofjesuschristtemples.org/assets/img/temples/tokyo-japan-temple/tokyo-japan-temple-8154.jpg" alt="Tokyo Japan Temple">
                <figcaption>Tokyo Japan Temple</figcaption>
            </figure>
            <!-- Repeat figure element 8 more times for other temples -->
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Yerlin A. Rodriguez | Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
